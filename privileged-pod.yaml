apiVersion: v1
kind: Pod
metadata:
  name: iac-test-pod
spec:
  containers:
    - name: test-container
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
